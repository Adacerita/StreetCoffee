<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>Portofolio Tailwind</title>
    <link href="dist/output.css" rel="stylesheet" />
</head>

<!-- Hero section -->
<section id="home" class="pt-35 mt-4">
    <div class="container">
        <div class="flex flex-wrap">
            <div class="w-full self-center px-4 lg:w-1/2">
                <h1 class="text-base font-semibold text-primary md:text-xl"><span
                        class="block font-bold text-dark text-3xl mt-1 lg:text-3xl">Welcome To</span></h1>
                <h2 class="font-bold text-gray-700 text-lg mb-5 lg:text-2xl">Ada Cerita Coffee<span class="text-dark">
                    </span></h2>
            </div>
            <div class="w-full self-end px-4 lg:w-1/2">
                <div class="relative mt-8 lg:mt-9 lg:right-0 flex items-center justify-center">
                    <!-- Efek gradasi abu-abu di luar lingkaran -->
                    <div
                        class="relative w-[100px] h-[100px] rounded-full bg-gradient-to-tr from-gray-500 via-gray-600 to-gray-500 p-[2px] shadow-lg">
                        <!-- Gambar lingkaran -->
                        <img src="img/profile1.jpeg" alt="Whagea Saputra"
                            class="w-full h-full object-cover rounded-full" />
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
<!-- Hero section end -->

<!-- style start -->

<!-- style end -->

<!-- Achivment Start -->
<section id="style" class="pt-35 mt-10">
    <div class="container">
        <div class="flex items-center justify-between">
            <div class="text-2xl font-bold text-dark">
                Tentang Kami
            </div>
            <div class="mx-7 flex-1 border-t border-neutral-950"></div>
        </div>
        <div class="mt-7 grid grid-cols-1 gap-6 md:grid-cols-2">
            <div>
                <div class="aspect-video w-full rounded-lg border border-neutral-700 p-1.5">
                    <img src="img/menu.jpeg" alt="" srcset="">
                </div>
                <div class="text-1xl font-semibold text-gray-500 mt-5">

                </div>
            </div>
        </div>
    </div>
</section>
<!-- Achivment end -->
